name: Build and deploy Python app to Azure Web App - who-drank-my-coke-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend/app
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7535DE78F9B14485BF2F06C4F5F7103D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C33B661A70714497BAAE80798F109B7B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7736567C5B704569BD0A41B315792937 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'who-drank-my-coke-api'
          slot-name: 'Production'
